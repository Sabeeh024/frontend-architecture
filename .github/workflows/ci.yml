name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # architecture — the boundary rules from topic 07
      - run: npm run lint
      - run: npm run depgraph:check

      # behaviour
      - run: npm test

      # it still has to build
      - run: npm run build
